<!DOCTYPE html>
<html>
<head>
  <title>n8n Gemini Copilot Settings</title>
  <style>
    body { font-family: sans-serif; font-size: 14px; width: 300px; padding: 10px; }
    label { display: block; margin-top: 10px; }
    input[type='password'], select { width: 100%; padding: 5px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 15px; padding: 8px 15px; cursor: pointer; }
    #status { margin-top: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <h3>n8n Gemini Copilot Settings</h3>

  <label for="geminiApiKey">Gemini API Key:</label>
  <input type="password" id="geminiApiKey">

  <label for="geminiModel">Gemini Model:</label>
  <select id="geminiModel">
    <option value="gemini-pro">gemini-pro</option>
    <option value="gemini-1.0-pro">gemini-1.0-pro</option>
    <option value="gemini-1.5-flash">gemini-1.5-flash</option>
    <option value="gemini-1.5-pro">gemini-1.5-pro</option>
    <!-- Add more models as needed -->
  </select>

  <button id="saveButton">Save Settings</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
