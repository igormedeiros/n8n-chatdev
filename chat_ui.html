<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat UI</title>
    <style>
        /* Basic styling for the chat UI - can be expanded */
        .chat-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }
        .chat-header {
            background-color: #f0f0f0;
            padding: 10px;
            border-bottom: 1px solid #ccc;
            text-align: center;
            font-weight: bold;
        }
        .messages {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            border-bottom: 1px solid #ccc;
            background-color: #fff;
        }
        .message {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 4px;
        }
        .user-message {
            background-color: #e1f5fe;
            align-self: flex-end;
            margin-left: auto; /* Push to right */
        }
        .ai-message {
            background-color: #f0f0f0;
            align-self: flex-start;
        }
        .ai-message pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background-color: #e8e8e8;
            padding: 5px;
            border-radius: 3px;
        }
        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ccc;
        }
        .input-area input[type="text"] {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .input-area button {
            padding: 8px 15px;
            margin-left: 10px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .input-area button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">n8n Gemini Copilot</div>
        <div class="messages" id="chatMessages">
            <!-- Messages will be appended here -->
            <div class="message ai-message">Hello! How can I help you with your n8n workflow today?</div>
        </div>
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="Describe what you want to build or modify...">
            <button id="sendChatMessage">Send</button>
        </div>
    </div>
    <!-- Script for chat functionality (chat_ui.js) would be linked here if this was a standalone page -->
    <!-- <script src="chat_ui.js"></script> -->
</body>
</html>
